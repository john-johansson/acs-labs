apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stackrox-generated-postgres
  namespace: backend
  labels:
    network-policy-generator.stackrox.io/generated: "true"
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-server
    ports:
    - protocol: TCP
      port: 5432
